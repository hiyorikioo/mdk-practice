<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список задач</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
        li { padding: 4px 0; }
        .finished { text-decoration: line-through; color: #888; }
        .empty-note { color: #888; font-style: italic; }
        .add-form { margin-bottom: 16px; }
        .add-form input { padding: 6px; width: 70%; }
    </style>
</head>
<body>
    <h1>Список задач</h1>

    <form method="post" action="/" class="add-form">
        <input type="text" name="title" placeholder="Новая задача" maxlength="200">
        <button type="submit">Добавить</button>
    </form>
    {% if task_list %}
        <ul>
            {% for item in task_list %}
                {% if item.status == 'done' %}
                    <li class="finished">{{ item.title }}</li>
                {% else %}
                    <li>{{ item.title }}</li>
                {% endif %}
            {% endfor %}
        </ul>
    {% else %}
        <p class="empty-note">Задач пока нет.</p>
    {% endif %}
</body>
</html>
