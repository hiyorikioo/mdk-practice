<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список задач</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
        li { padding: 4px 0; }
        .finished { text-decoration: line-through; color: #888; }
        .empty-note { color: #888; font-style: italic; }
        .add-form { margin-bottom: 16px; }
        .add-form input { padding: 6px; width: 70%; }
        .error-note { color: #c0392b; }
        .row-form { display: inline; margin-left: 8px; }
    </style>
</head>
<body>
    <h1>Список задач</h1>

    <form method="post" action="/" class="add-form">
        <input type="text" name="title" placeholder="Новая задача" maxlength="200">
        <button type="submit">Добавить</button>
    </form>
    {% if error_text %}
        <p class="error-note">{{ error_text }}</p>
    {% endif %}
    {% if task_list %}
        <ul>
            {% for item in task_list %}
                <li>
                    <span class="{{ 'finished' if item.status == 'done' else '' }}">{{ item.title }}</span>
                    <form method="post" action="{{ url_for('toggle_route', task_id=item.id) }}" class="row-form">
                        <button type="submit">{{ 'Вернуть' if item.status == 'done' else 'Готово' }}</button>
                    </form>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p class="empty-note">Задач пока нет.</p>
    {% endif %}
</body>
</html>
